apiVersion: v1
kind: Namespace
metadata:
  name: agents
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agents
  labels:
    app.kubernetes.io/name: anomaly-detector-postgres
    app.kubernetes.io/part-of: kubernetes-sre-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anomaly-detector-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: anomaly-detector-postgres
  namespace: agents
  labels:
    app.kubernetes.io/name: anomaly-detector-postgres
    app.kubernetes.io/part-of: kubernetes-sre-agent
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-detector-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-detector-postgres
    spec:
      nodeSelector:
        role: tools
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: anomaly-detector-postgres
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: anomaly-detector-postgres
          # StatefulSet volumeClaimTemplates are immutable. Preserve the label
          # used by existing clusters so upgrades retain the bound database PVC.
          app.kubernetes.io/part-of: anomaly-detector
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
