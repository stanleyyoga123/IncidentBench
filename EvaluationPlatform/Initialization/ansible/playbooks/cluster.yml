---
- name: Install the k3s control plane
  hosts: control_plane
  become: true
  gather_facts: true
  handlers:
    - name: Restart k3s server
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
  tasks:
    - name: Create the k3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bound terminated Pod retention
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          kube-controller-manager-arg:
            - terminated-pod-gc-threshold={{ terminated_pod_gc_threshold }}
      notify: Restart k3s server

    - name: Download the official k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/get-k3s.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install k3s server
      ansible.builtin.command:
        argv:
          - /usr/local/src/get-k3s.sh
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server --node-name {{ inventory_hostname }} --write-kubeconfig-mode 0640"
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Wait for the Kubernetes API
      ansible.builtin.command: k3s kubectl get --raw=/readyz
      register: k3s_ready
      retries: 30
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Read the node join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token
      no_log: true

    - name: Read the generated kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    - name: Store the operator kubeconfig in EvaluationPlatform/Initialization/generated
      ansible.builtin.copy:
        dest: "{{ k3s_kubeconfig_local }}"
        mode: "0600"
        content: >-
          {{ (k3s_kubeconfig.content | b64decode)
             | replace('127.0.0.1', ansible_host) }}
      delegate_to: localhost
      become: false
      no_log: true

    - name: Apply pending k3s configuration changes before joining agents
      ansible.builtin.meta: flush_handlers

- name: Join tool and service nodes to k3s
  hosts: tool_nodes:service_nodes
  become: true
  gather_facts: true
  tasks:
    - name: Download the official k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/get-k3s.sh
        owner: root
        group: root
        mode: "0755"

    - name: Read the join token from the control plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: delegated_k3s_token
      no_log: true

    - name: Install k3s agent
      ansible.builtin.command:
        argv:
          - /usr/local/src/get-k3s.sh
      environment:
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ delegated_k3s_token.content | b64decode | trim }}"
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "agent --node-name {{ inventory_hostname }}"
      args:
        creates: /etc/systemd/system/k3s-agent.service
      no_log: true

- name: Label cluster nodes by workload role
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Label tool nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig_local }}"
        state: patched
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ item }}"
            labels:
              role: tools
      loop: "{{ groups['tool_nodes'] }}"

    - name: Label service nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig_local }}"
        state: patched
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ item }}"
            labels:
              role: services
      loop: "{{ groups['service_nodes'] }}"
