apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluation-orchestrator-ingress
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app: evaluation-orchestrator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: evaluation-runner
      ports:
        - protocol: TCP
          port: 8080
