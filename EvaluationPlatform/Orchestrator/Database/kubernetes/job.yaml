apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration-20260817-0002
  namespace: agents
  labels:
    app.kubernetes.io/name: database-job
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-job
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      nodeSelector:
        role: tools
      containers:
        - name: migration
          image: incidentbench.invalid/database-job:configure-me
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: database-job-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: anomaly-detector-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: anomaly-detector-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anomaly-detector-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
