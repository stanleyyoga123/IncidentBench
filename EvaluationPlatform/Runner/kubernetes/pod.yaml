apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-runner
  namespace: agents
  labels:
    app.kubernetes.io/name: evaluation-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evaluation-runner-cluster-admin
  labels:
    app.kubernetes.io/name: evaluation-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: evaluation-runner
    namespace: agents
---
apiVersion: v1
kind: Pod
metadata:
  name: evaluation-runner
  namespace: agents
  labels:
    app.kubernetes.io/name: evaluation-runner
spec:
  serviceAccountName: evaluation-runner
  nodeSelector:
    role: tools
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  containers:
    - name: evaluation-runner
      image: stanleyyoga123/evaluation:dev
      imagePullPolicy: Always
      command: ["sleep"]
      args: ["infinity"]
      workingDir: /workspace/EvaluationPlatform/Runner
      env:
        - name: INFRASTRUCTURE_ROOT
          value: /workspace/EvaluationPlatform/Initialization
        - name: ONLINE_BOUTIQUE_ROOT
          value: /workspace/EvaluationPlatform/Runner/resources/applications/online-boutique
        - name: TEASTORE_ROOT
          value: /workspace/EvaluationPlatform/Runner/resources/applications/teastore
        - name: SOCK_SHOP_ROOT
          value: /workspace/EvaluationPlatform/Runner/resources/applications/sock-shop
        - name: CHAOS_NODE_INVENTORY
          value: /workspace/EvaluationPlatform/Initialization/ansible/inventory.ini
        - name: CHAOS_NODE_SSH_USER
          value: chaos-cleaner
        - name: CHAOS_NODE_SSH_IDENTITY_FILE
          value: /var/run/evaluation-runner/ssh/id_ed25519
        - name: CHAOS_NODE_SSH_KNOWN_HOSTS_FILE
          value: /var/run/evaluation-runner/ssh/known_hosts
        - name: PROMETHEUS_URL
          value: http://prometheus-server.monitoring.svc.cluster.local
      envFrom:
        - secretRef:
            name: evaluation-runner-env
        - secretRef:
            name: evaluation-runner-s3
            optional: true
      volumeMounts:
        - name: inventory
          mountPath: /workspace/EvaluationPlatform/Initialization/ansible/inventory.ini
          subPath: inventory.ini
          readOnly: true
        - name: worker-node-ssh
          mountPath: /var/run/evaluation-runner/ssh
          readOnly: true
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
  volumes:
    - name: inventory
      configMap:
        name: evaluation-runner-inventory
    - name: worker-node-ssh
      secret:
        secretName: evaluation-runner-ssh
        defaultMode: 0400
