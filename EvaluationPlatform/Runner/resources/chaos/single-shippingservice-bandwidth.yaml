apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-shippingservice-bandwidth
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: bandwidth
    mode: all
    selector:
      namespaces:
      - online-boutique
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - shippingservice
    # Each pod has an independent ceiling, so bounded scale-out increases total
    # throughput without changing the application or restarting it as a remedy.
    bandwidth:
      rate: 1mbps
      limit: 2097152
      buffer: 10000
    duration: 25s
