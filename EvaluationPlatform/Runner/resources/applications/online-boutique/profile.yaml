id: online-boutique
namespace: online-boutique
host: http://frontend.online-boutique.svc.cluster.local
port_forward_service: frontend
port_forward_remote_port: 80
loadgenerator_module: resources.applications.online_boutique
installer:
  type: kustomize
  source_environment: ONLINE_BOUTIQUE_ROOT
  source_default: EvaluationPlatform/Runner/resources/applications/online-boutique
  path: kustomize
  required_files:
    - kustomization.yaml
  prerequisite_manifests: []
placement:
  mode: rendered
  root: applications/online-boutique/kustomize/overlays
  workload_names:
    - adservice
    - cartservice
    - checkoutservice
    - currencyservice
    - emailservice
    - frontend
    - paymentservice
    - productcatalogservice
    - recommendationservice
    - redis-cart
    - shippingservice
  workload_prefixes: []
  label_key: app
  node_selector_key: role
  node_selector_value: services
