apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique
# All application Deployments may use any node labelled role=services. Replica
# distribution is preferred across hostnames without making scheduling fail
# when an even spread is temporarily impossible.
resources:
  - ../../base
  - hpa.yaml
patches:
  - path: node-selector-path.yaml
    target:
      kind: Deployment
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: adservice
    patch: |-
      - op: add
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: adservice
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cartservice
    patch: |-
      - op: add
