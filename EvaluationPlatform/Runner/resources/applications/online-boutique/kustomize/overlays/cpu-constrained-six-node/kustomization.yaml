apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique
# Evaluation-only profile: preserve canonical scheduling while modelling an
# overly restrictive policy in which every application CPU limit equals its
# request and therefore provides no burst headroom.
resources:
  - ../canonical-six-node
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: adservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cartservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkoutservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: currencyservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
  - target:
      group: apps
      version: v1
      kind: Deployment
