id: sock-shop
namespace: sock-shop
host: http://front-end.sock-shop.svc.cluster.local
port_forward_service: front-end
port_forward_remote_port: 80
loadgenerator_module: resources.applications.sock_shop
startup_delay_seconds: 60
installer:
  type: kustomize
  source_environment: SOCK_SHOP_ROOT
  source_default: EvaluationPlatform/Runner/resources/applications/sock-shop
  path: kustomize
  required_files:
    - kustomization.yaml
  prerequisite_manifests: []
placement:
  mode: rendered
  root: applications/sock-shop/kustomize/overlays
  workload_names:
    - carts
    - carts-db
    - catalogue
    - catalogue-db
    - front-end
    - orders
    - orders-db
    - payment
    - queue-master
    - rabbitmq
    - session-db
    - shipping
    - user
    - user-db
  workload_prefixes: []
  label_key: app
  node_selector_key: role
  node_selector_value: services
