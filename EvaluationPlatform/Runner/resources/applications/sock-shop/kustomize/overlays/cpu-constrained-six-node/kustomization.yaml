# Preserve canonical placement; remove CPU burst headroom on the three targets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sock-shop
resources:
- ../canonical-six-node
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: front-end
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 100m
- target:
    group: apps
    version: v1
    kind: Deployment
    name: orders
  patch: |-
    # Cold Java startup at 100m CPU needs more than the canonical five minutes.
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/failureThreshold
      value: 180
    - op: add
      path: /spec/progressDeadlineSeconds
      value: 1200
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 100m
- target:
    group: apps
    version: v1
    kind: Deployment
    name: catalogue
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 100m
