apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  labels:
    app: teastore-registry
spec:
  selector:
    matchLabels:
      app: teastore-registry
  template:
    metadata:
      labels:
        app: teastore-registry
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "false"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: teastore-registry
          image: descartesresearch/teastore-registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          startupProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  labels:
    app: teastore-registry
spec:
  type: ClusterIP
  selector:
    app: teastore-registry
  ports:
    - name: http
      port: 8080
      targetPort: 8080
