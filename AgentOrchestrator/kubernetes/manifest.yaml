apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-orchestrator, namespace: agents}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-orchestrator}}
  template:
    metadata: {labels: {app: agent-orchestrator, agent-platform: coordinator}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {role: tools}
      containers:
        - name: agent-orchestrator
          image: stanleyyoga123/agent-orchestrator:dev
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: agent-orchestrator-secrets}}]
          volumeMounts: [{name: config, mountPath: /app/.env, subPath: .env, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: config, configMap: {name: agent-orchestrator-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: agent-orchestrator, namespace: agents}
spec: {type: ClusterIP, selector: {app: agent-orchestrator}, ports: [{name: http, port: 8080, targetPort: http}]}
