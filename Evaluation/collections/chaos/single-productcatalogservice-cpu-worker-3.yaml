apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-productcatalogservice-cpu-worker-3
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: StressChaos
  stressChaos:
    mode: all
    selector:
      namespaces:
      - online-boutique
      nodes:
      - worker-node-3
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - productcatalogservice
    stressors:
      cpu:
        workers: 1
        # 45% of one CPU approximates the 500m limit minus 50m.
        load: 45
    duration: 29s
