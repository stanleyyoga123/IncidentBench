apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-productcatalogservice-bandwidth
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: bandwidth
    mode: all
    selector:
      namespaces:
      - online-boutique
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - productcatalogservice
    # The limit is per pod, so bounded horizontal scaling increases aggregate
    # service throughput without requiring a restart or version change.
    bandwidth:
      rate: 1mbps
      limit: 2097152
      buffer: 10000
    duration: 25s
