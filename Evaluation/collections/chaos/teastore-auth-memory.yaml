apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: teastore-auth-memory
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: StressChaos
  stressChaos:
    mode: all
    selector:
      namespaces:
      - teastore
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - teastore-auth
    stressors:
      memory:
        workers: 1
        # Sustained allocation exposes memory-limit pressure without filling a node.
        size: 400MB
    duration: 25s
