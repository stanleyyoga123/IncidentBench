apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-emailservice-cpu
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: StressChaos
  stressChaos:
    mode: all
    selector:
      namespaces:
      - online-boutique
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - emailservice
    stressors:
      cpu:
        workers: 1
        # 55% of one CPU exceeds the current 500m limit under normal work.
        load: 55
    duration: 25s
