apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-paymentservice-capacity-loss
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: PodChaos
  podChaos:
    action: pod-failure
    mode: one
    selector:
      namespaces:
      - online-boutique
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - paymentservice
    duration: 25s
