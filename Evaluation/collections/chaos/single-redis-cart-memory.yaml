apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: single-redis-cart-memory
  namespace: chaos-mesh
spec:
  schedule: '@every 30s'
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: StressChaos
  stressChaos:
    mode: all
    selector:
      namespaces:
      - online-boutique
      podPhaseSelectors:
      - Running
      expressionSelectors:
      - key: app
        operator: In
        values:
        - redis-cart
    stressors:
      memory:
        workers: 1
        # A fixed allocation can be absorbed by right-sizing the 512Mi limit.
        size: 400MB
    duration: 25s
