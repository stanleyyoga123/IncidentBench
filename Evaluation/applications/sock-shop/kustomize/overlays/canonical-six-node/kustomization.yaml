          kind: Deployment
          name: rabbitmq
        fieldPaths:
          - spec.template.metadata.labels.app
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.app
  - source:
      kind: Deployment
      name: session-db
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: session-db
        fieldPaths:
          - spec.template.metadata.labels.app
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.app
  - source:
      kind: Deployment
      name: shipping
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
