        fieldPaths:
          - spec.template.metadata.labels.app
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.app
  - source:
      kind: Deployment
      name: user
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: user
        fieldPaths:
          - spec.template.metadata.labels.app
          - spec.template.spec.topologySpreadConstraints.0.labelSelector.matchLabels.app
  - source:
