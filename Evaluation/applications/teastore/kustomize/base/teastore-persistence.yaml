apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  labels:
    app: teastore-persistence
spec:
  selector:
    matchLabels:
      app: teastore-persistence
  template:
    metadata:
      labels:
        app: teastore-persistence
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "false"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: teastore-persistence
          image: descartesresearch/teastore-persistence
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: "teastore-persistence"
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: REGISTRY_PORT
              value: "8080"
            - name: DB_HOST
              value: "teastore-db"
            - name: DB_PORT
              value: "3306"
            - name: SERVICE_PORT
              value: "8080"
          resources:
            requests:
              cpu: 1000m
              memory: 1536Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          startupProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-persistence
  labels:
    app: teastore-persistence
spec:
  type: ClusterIP
  selector:
    app: teastore-persistence
  ports:
    - name: http
      port: 8080
      targetPort: 8080
