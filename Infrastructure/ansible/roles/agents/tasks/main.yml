---
- name: Deploy the component-owned agent platform resources
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{
      (lookup('ansible.builtin.file', role_path + '/../../../../MCPTools/kubernetes/configmap.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../RCAAgent/kubernetes/configmap.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../RemediatorAgent/kubernetes/configmap.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../AgentOrchestrator/kubernetes/configmap.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../AnomalyDetector/kubernetes/configmap.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../MCPTools/kubernetes/rbac.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../MCPTools/kubernetes/network-probes.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../MCPTools/kubernetes/investigation.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../MCPTools/kubernetes/remediation.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../RCAAgent/kubernetes/manifest.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../RemediatorAgent/kubernetes/manifest.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../../AgentOrchestrator/kubernetes/manifest.yaml')
        | from_yaml_all | select | list)
      + (lookup('ansible.builtin.file', role_path + '/../../../kubernetes/agents/shared.yaml')
        | from_yaml_all | select | list)
    }}

- name: Set split service images
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: "{{ item.name }}", namespace: "{{ agents_namespace }}"}
      spec:
        template:
          spec:
            containers:
              - {name: "{{ item.name }}", image: "{{ item.image }}"}
  loop:
    - {name: mcp-tools-investigation, image: "{{ mcp_tools_image }}"}
    - {name: mcp-tools-remediation, image: "{{ mcp_tools_image }}"}
    - {name: rca-agent, image: "{{ rca_agent_image }}"}
    - {name: remediator-agent, image: "{{ remediator_agent_image }}"}
    - {name: agent-orchestrator, image: "{{ agent_orchestrator_image }}"}

- name: Start MCPTools deployments
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: "{{ item }}"
    replicas: 1
  loop: [mcp-tools-investigation, mcp-tools-remediation]

- name: Wait for MCPTools before job services
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: "{{ item }}"
  loop: [mcp-tools-investigation, mcp-tools-remediation]
  register: mcp_deployment
  retries: 60
  delay: 5
  until: mcp_deployment.resources[0].status.readyReplicas | default(0) | int == 1

- name: Start RCA and Remediator services
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: "{{ item }}"
    replicas: 1
  loop: [rca-agent, remediator-agent]

- name: Wait for RCA and Remediator services
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: "{{ item }}"
  loop: [rca-agent, remediator-agent]
  register: job_deployment
  retries: 60
  delay: 5
  until: job_deployment.resources[0].status.readyReplicas | default(0) | int == 1

- name: Start AgentOrchestrator
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: agent-orchestrator
    replicas: 1

- name: Wait for AgentOrchestrator
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ agents_namespace }}"
    name: agent-orchestrator
  register: orchestrator_deployment
  retries: 60
  delay: 5
  until: orchestrator_deployment.resources[0].status.readyReplicas | default(0) | int == 1

- name: Retire legacy CloudAgent resources after replacement readiness
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace | default(omit) }}"
    name: "{{ item.name }}"
  loop:
    - {api_version: apps/v1, kind: Deployment, namespace: "{{ agents_namespace }}", name: cloudagent}
    - {api_version: v1, kind: ServiceAccount, namespace: "{{ agents_namespace }}", name: cloudagent}
    - {api_version: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: cloudagent-namespace-admin-without-chaosmesh}
    - {api_version: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: cloudagent-node-maintainer}
    - {api_version: rbac.authorization.k8s.io/v1, kind: ClusterRoleBinding, name: cloudagent-node-maintainer}
    - {api_version: rbac.authorization.k8s.io/v1, kind: RoleBinding, namespace: "{{ application_namespace }}", name: cloudagent-namespace-admin-without-chaosmesh}
    - {api_version: rbac.authorization.k8s.io/v1, kind: RoleBinding, namespace: "{{ utility_namespace }}", name: cloudagent-network-probe-executor}
    - {api_version: rbac.authorization.k8s.io/v1, kind: Role, namespace: "{{ utility_namespace }}", name: cloudagent-network-probe-executor}
    - {api_version: apps/v1, kind: DaemonSet, namespace: "{{ utility_namespace }}", name: cloudagent-network-probe-overlay}
    - {api_version: apps/v1, kind: DaemonSet, namespace: "{{ utility_namespace }}", name: cloudagent-network-probe-underlay}

- name: Deploy AnomalyDetector after ingestion is ready
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    src: "{{ role_path }}/../../../../AnomalyDetector/kubernetes/manifest.yaml"

- name: Set the AnomalyDetector image
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: anomaly-detector, namespace: "{{ agents_namespace }}"}
      spec:
        template:
          spec:
            containers:
              - {name: anomaly-detector, image: "{{ anomaly_detector_image }}"}
