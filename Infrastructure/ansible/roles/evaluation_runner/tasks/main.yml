---
- name: Check evaluation runner SSH inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ chaos_cleaner_private_key_file }}"
    - "{{ chaos_cleaner_known_hosts_output }}"
  register: evaluation_ssh_inputs

- name: Require evaluation runner SSH inputs
  ansible.builtin.assert:
    that:
      - chaos_cleaner_private_key_file | length > 0
      - evaluation_ssh_inputs.results | map(attribute='stat.exists') | min
    fail_msg: >-
      Supply vault_chaos_cleaner_private_key_file and run node-cleaner.yml first.

- name: Create the evaluation node inventory ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: evaluation-node-inventory
        namespace: "{{ agents_namespace }}"
      data:
        inventory.ini: "{{ lookup('ansible.builtin.file', inventory_file) }}"

- name: Create the evaluation runner SSH Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: evaluation-runner-ssh
        namespace: "{{ agents_namespace }}"
      type: Opaque
      stringData:
        id_ed25519: "{{ lookup('ansible.builtin.file', chaos_cleaner_private_key_file) }}"
        known_hosts: "{{ lookup('ansible.builtin.file', chaos_cleaner_known_hosts_output) }}"
  no_log: true

- name: Create optional evaluation S3 credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: evaluation-runner-s3
        namespace: "{{ agents_namespace }}"
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: "{{ evaluation_aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ evaluation_aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ evaluation_aws_region }}"
        S3_RESULTS_URI: "{{ evaluation_s3_uri }}"
  when:
    - evaluation_s3_uri | length > 0
    - evaluation_aws_access_key_id | length > 0
    - evaluation_aws_secret_access_key | length > 0
  no_log: true

- name: Register Chaos Mesh physical machines
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{ lookup('ansible.builtin.template', role_path + '/templates/physicalmachines.yaml.j2')
       | from_yaml_all | select | list }}

- name: Install the evaluation runner
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    definition: "{{ item }}"
  loop: >-
    {{ lookup('ansible.builtin.template', role_path + '/templates/runner.yaml.j2')
       | from_yaml_all | select | list }}
