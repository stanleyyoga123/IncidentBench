---
- name: Deploy PostgreSQL
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    src: "{{ role_path }}/../../../kubernetes/database/postgres.yaml"

- name: Restart PostgreSQL when its credential Secret changes
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: anomaly-detector-postgres
        namespace: "{{ agents_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              agent-platform/database-secret-checksum: "{{ database_password | hash('sha256') }}"
  no_log: true

- name: Create DatabaseJob non-secret configuration
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    src: "{{ role_path }}/../../../../DatabaseJob/kubernetes/configmap.yaml"

- name: Set explicit database workflow reset approval
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: patched
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: database-job-config
        namespace: "{{ agents_namespace }}"
      data:
        ALLOW_AGENT_WORKFLOW_RESET: "{{ allow_agent_workflow_reset | bool | lower }}"

- name: Wait for PostgreSQL StatefulSet readiness
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ agents_namespace }}"
    name: anomaly-detector-postgres
  register: postgres_statefulset
  retries: 60
  delay: 5
  until:
    - postgres_statefulset.resources | length == 1
    - postgres_statefulset.resources[0].status.readyReplicas | default(0) | int == 1

- name: Synchronize the existing PostgreSQL role with the Secret password
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    namespace: "{{ agents_namespace }}"
    pod: anomaly-detector-postgres-0
    command: >-
      /bin/sh -ec 'printf "%s\n%s\n" "$POSTGRES_PASSWORD" "$POSTGRES_PASSWORD" |
      psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      -c "\\password $POSTGRES_USER"'
  no_log: true

- name: Remove an earlier migration Job with the same revision
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ agents_namespace }}"
    name: database-migration-20260817-0002
    wait: true

- name: Remove the obsolete legacy migration Job
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ agents_namespace }}"
    name: database-migration-20260817-0001
    wait: true

- name: Run the Alembic migration Job
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    state: present
    src: "{{ role_path }}/../../../../DatabaseJob/kubernetes/job.yaml"

- name: Wait for the migration Job to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k3s_kubeconfig_local }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ agents_namespace }}"
    name: database-migration-20260817-0002
  register: migration_job
  retries: 60
  delay: 5
  until:
    - migration_job.resources | length == 1
    - migration_job.resources[0].status.succeeded | default(0) | int == 1
