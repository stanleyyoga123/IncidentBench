---
# Cluster lifecycle. The stable channel resolves the current supported k3s
# release when the playbook runs; pin k3s_version for reproducible rebuilds.
k3s_channel: stable
k3s_version: ""
k3s_server_url: "https://{{ hostvars[groups['control_plane'][0]].ansible_host }}:6443"
k3s_kubeconfig_local: "{{ inventory_dir }}/../generated/kubeconfig.yaml"

# Current explicit platform pin. Empty chart versions mean the newest chart in
# the refreshed upstream repository; set them in a release vars file to lock a
# reproducible environment.
chaos_mesh_chart_version: "2.8.3"
prometheus_chart_version: ""
grafana_chart_version: ""
istio_chart_version: ""
loki_chart_version: ""
alloy_chart_version: ""

install_grafana: true
install_evaluation_runner: true
grafana_dashboard_files:
  - dashboard.json
  - dashboard_v2.json
  - logs_dashboard.json
  - node_dashboard.json
  - pod_dashboard.json
  - resource_dashboard.json
  - throttled_dashboard.json

prometheus_namespace: monitoring
observability_namespace: observability
istio_namespace: istio-system
chaos_mesh_namespace: chaos-mesh
agents_namespace: agents
utility_namespace: utility
application_namespace: online-boutique

# Images are intentionally configurable. Publish immutable digests/tags before
# running a reproducible evaluation.
anomaly_detector_image: stanleyyoga123/anomaly-detector:dev
agent_orchestrator_image: stanleyyoga123/agent-orchestrator:dev
rca_agent_image: stanleyyoga123/rca-agent:dev
remediator_agent_image: stanleyyoga123/remediator-agent:dev
mcp_tools_image: stanleyyoga123/mcp-tools:dev
database_job_image: database-job:latest
evaluation_runner_image: stanleyyoga123/agent-evaluator:1.2.0-rc3

# Supply database_password through Ansible Vault or --extra-vars. Do not commit
# it. The username/database defaults are non-secret identifiers.
database_name: anomaly_detector
database_user: anomaly_detector
database_password: "{{ vault_database_password | default('') }}"
database_host: postgres.agents.svc.cluster.local
database_port: 5432

# Runtime detector profile mutations are disabled when this token is empty.
detector_profile_api_token: "{{ vault_detector_profile_api_token | default('') }}"
agent_ingestion_token: "{{ vault_agent_ingestion_token | default('') }}"
agent_control_token: "{{ vault_agent_control_token | default('') }}"
rca_submit_token: "{{ vault_rca_submit_token | default('') }}"
remediator_submit_token: "{{ vault_remediator_submit_token | default('') }}"
mcp_investigation_token: "{{ vault_mcp_investigation_token | default('') }}"
mcp_remediation_token: "{{ vault_mcp_remediation_token | default('') }}"
allow_agent_workflow_reset: false

# Agent model and tracing credentials. Secret values must come from Vault
# or --extra-vars.
agent_llm_model: Qwen/Qwen3.6-35B-A3B
agent_llm_url: "{{ vault_agent_llm_url | default('') }}"
agent_llm_token: "{{ vault_agent_llm_token | default('EMPTY') }}"
langfuse_base_url: "{{ vault_langfuse_base_url | default('') }}"
langfuse_public_key: "{{ vault_langfuse_public_key | default('') }}"
langfuse_secret_key: "{{ vault_langfuse_secret_key | default('') }}"

# Node chaos and restricted cleanup.
chaosd_version: v1.4.1
chaosd_https_port: 31768
chaosd_archive: "chaosd-{{ chaosd_version }}-linux-amd64.tar.gz"
chaosd_download_url: "https://mirrors.chaos-mesh.org/{{ chaosd_archive }}"
chaosd_install_parent: /opt
chaosd_pki_dir: /etc/chaosd/pki
chaosd_cert_secret_name: chaos-mesh-chaosd-client-certs
chaosd_cert_secret_namespace: chaos-mesh
chaosd_tls_server_name: chaosd.chaos-mesh.org
chaos_cleaner_user: chaos-cleaner
chaos_cleaner_public_key_file: "{{ vault_chaos_cleaner_public_key_file | default('') }}"
chaos_cleaner_private_key_file: "{{ vault_chaos_cleaner_private_key_file | default('') }}"
chaos_cleaner_known_hosts_output: "{{ inventory_dir }}/../generated/evaluation-runner-known_hosts"

# Optional evaluation result upload. All three credential fields must be set to
# create evaluation-runner-s3.
evaluation_s3_uri: "{{ vault_evaluation_s3_uri | default('') }}"
evaluation_aws_access_key_id: "{{ vault_evaluation_aws_access_key_id | default('') }}"
evaluation_aws_secret_access_key: "{{ vault_evaluation_aws_secret_access_key | default('') }}"
evaluation_aws_region: ap-southeast-2
