---
# Cluster lifecycle. The stable channel resolves the current supported k3s
# release when the playbook runs; pin k3s_version for reproducible rebuilds.
k3s_channel: stable
k3s_version: ""
k3s_server_url: "https://{{ hostvars[groups['control_plane'][0]].ansible_host }}:6443"
k3s_kubeconfig_local: "{{ ansible_config_file | dirname }}/../generated/kubeconfig.yaml"

# Current explicit platform pin. Empty chart versions mean the newest chart in
# the refreshed upstream repository; set them in a release vars file to lock a
# reproducible environment.
chaos_mesh_chart_version: "2.8.3"
prometheus_chart_version: ""
grafana_chart_version: ""
# Keep the control plane, base CRDs, gateway, and injected proxies on the same
# tested release. Upgrade this deliberately; never follow the latest chart.
istio_chart_version: "1.29.2"
loki_chart_version: ""
alloy_chart_version: ""

install_grafana: true
grafana_dashboard_files:
  - dashboard.json
  - dashboard_v2.json
  - logs_dashboard.json
  - node_dashboard.json
  - pod_dashboard.json
  - resource_dashboard.json
  - throttled_dashboard.json

prometheus_namespace: monitoring
observability_namespace: observability
istio_namespace: istio-system
chaos_mesh_namespace: chaos-mesh
agents_namespace: agents
utility_namespace: utility
application_namespace: online-boutique

# Node chaos and restricted cleanup.
chaosd_version: v1.4.1
chaosd_https_port: 31768
chaosd_archive: "chaosd-{{ chaosd_version }}-linux-amd64.tar.gz"
chaosd_download_url: "https://mirrors.chaos-mesh.org/{{ chaosd_archive }}"
chaosd_install_parent: /opt
chaosd_pki_dir: /etc/chaosd/pki
chaosd_cert_secret_name: chaos-mesh-chaosd-client-certs
chaosd_cert_secret_namespace: chaos-mesh
chaosd_tls_server_name: chaosd.chaos-mesh.org
chaos_cleaner_user: chaos-cleaner
chaos_cleaner_public_key_file: "{{ vault_chaos_cleaner_public_key_file | default('') }}"
chaos_cleaner_known_hosts_output: "{{ ansible_config_file | dirname }}/../generated/evaluation-runner-known_hosts"
