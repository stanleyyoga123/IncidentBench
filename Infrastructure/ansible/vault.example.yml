---
# Copy this file outside the repository (or to an ignored vault.yml), replace
# placeholders, then encrypt it with: ansible-vault encrypt vault.yml
vault_database_password: "<database-password>"
vault_detector_profile_api_token: "<long-random-detector-profile-token>"
vault_agent_ingestion_token: "<long-random-ingestion-token>"
vault_agent_control_token: "<long-random-control-token>"
vault_rca_submit_token: "<long-random-rca-token>"
vault_remediator_submit_token: "<long-random-remediation-token>"
vault_mcp_investigation_token: "<long-random-investigation-mcp-token>"
vault_mcp_remediation_token: "<long-random-remediation-mcp-token>"
vault_agent_llm_url: "<openai-compatible-endpoint>"
vault_agent_llm_token: "<model-api-token>"
vault_langfuse_base_url: ""
vault_langfuse_public_key: ""
vault_langfuse_secret_key: ""

vault_chaos_cleaner_public_key_file: "/absolute/path/to/evaluation-chaos-cleaner.pub"
vault_chaos_cleaner_private_key_file: "/absolute/path/to/evaluation-chaos-cleaner"

# Optional evaluation artifact upload.
vault_evaluation_s3_uri: ""
vault_evaluation_aws_access_key_id: ""
vault_evaluation_aws_secret_access_key: ""
