server:
  nodeSelector:
    role: tools
  global:
    scrape_interval: 15s
  retention: 3d
  # Time retention alone allowed the TSDB to consume most of the local-path
  # volume during high-cardinality experiments. Keep a hard size ceiling too.
  retentionSize: 4GB
  resources:
    requests:
      cpu: 500m

alertmanager:
  nodeSelector:
    role: tools

kube-state-metrics:
  nodeSelector:
    role: tools

prometheus-node-exporter:
  tolerations:
    - operator: Exists

prometheus-pushgateway:
  enabled: false
