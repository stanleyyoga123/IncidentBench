# Apply with the existing prometheus-community/prometheus release.
# Keep this rule group in sync with prometheus-recording-rules.yml.
serverFiles:
  recording_rules.yml:
    groups:
      - name: anomaly-detector-metrics
        interval: 30s
        rules:
          - record: anomaly_detector:deployment_cpu_usage
            expr: >-
              sum by (namespace, deployment) (
                rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[2m])
                * on (namespace, pod) group_left(replicaset)
                  label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
              )

          - record: anomaly_detector:deployment_cpu_request_utilization_percent
            expr: >-
              100 *
              sum by (namespace, deployment) (
                rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[2m])
                * on (namespace, pod) group_left(replicaset)
                  label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
              )
              /
              clamp_min(
                sum by (namespace, deployment) (
                  kube_pod_container_resource_requests{resource="cpu",unit="core"}
                  * on (namespace, pod) group_left(replicaset)
                    label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                  * on (namespace, replicaset) group_left(deployment)
                    label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
                ),
                0.001
              )

          - record: anomaly_detector:deployment_memory_request_utilization_percent
            expr: >-
              100 *
              sum by (namespace, deployment) (
                container_memory_working_set_bytes{container!="",container!="POD"}
                * on (namespace, pod) group_left(replicaset)
                  label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
              )
              /
              clamp_min(
                sum by (namespace, deployment) (
                  kube_pod_container_resource_requests{resource="memory",unit="byte"}
                  * on (namespace, pod) group_left(replicaset)
                    label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                  * on (namespace, replicaset) group_left(deployment)
                    label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
                ),
                1
              )

          - record: anomaly_detector:deployment_disk_io_bytes_per_second
            expr: >-
              sum by (namespace, deployment) (
                (
                  rate(container_fs_reads_bytes_total{container!="",container!="POD"}[2m])
                  + rate(container_fs_writes_bytes_total{container!="",container!="POD"}[2m])
                )
                * on (namespace, pod) group_left(replicaset)
                  label_replace(kube_pod_owner{owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.+)")
                * on (namespace, replicaset) group_left(deployment)
                  label_replace(kube_replicaset_owner{owner_kind="Deployment"}, "deployment", "$1", "owner_name", "(.+)")
              )

          - record: anomaly_detector:deployment_network_io_bytes_per_second
            expr: >-
              sum by (namespace, deployment) (
                label_replace(
                  label_replace(
                    rate(istio_request_bytes_sum{reporter="destination"}[2m])
                    + rate(istio_response_bytes_sum{reporter="destination"}[2m]),
                    "namespace", "$1", "destination_workload_namespace", "(.+)"
                  ),
                  "deployment", "$1", "destination_workload", "(.+)"
                )
              )

          - record: anomaly_detector:app_instance_count
            expr: max by (namespace, deployment) (kube_deployment_spec_replicas)

          - record: anomaly_detector:traffic_rps
            expr: >-
              sum by (namespace, deployment) (
                label_replace(
                  label_replace(
                    rate(istio_requests_total{reporter="destination"}[2m]),
                    "namespace", "$1", "destination_workload_namespace", "(.+)"
                  ),
                  "deployment", "$1", "destination_workload", "(.+)"
                )
              )

          - record: anomaly_detector:response_time_p95_seconds
            expr: >-
              histogram_quantile(
                0.95,
                sum by (le, namespace, deployment) (
                  label_replace(
                    label_replace(
                      rate(istio_request_duration_milliseconds_bucket{reporter="destination"}[2m]),
                      "namespace", "$1", "destination_workload_namespace", "(.+)"
                    ),
                    "deployment", "$1", "destination_workload", "(.+)"
                  )
                )
              ) / 1000

          - record: anomaly_detector:http_5xx_rps
            expr: >-
              (
                sum by (namespace, deployment) (
                  label_replace(
                    label_replace(
                      rate(istio_requests_total{reporter="destination",response_code=~"5.."}[2m]),
                      "namespace", "$1", "destination_workload_namespace", "(.+)"
                    ),
                    "deployment", "$1", "destination_workload", "(.+)"
                  )
                )
              )
              or on (namespace, deployment)
              (0 * anomaly_detector:traffic_rps)

          - record: anomaly_detector:http_5xx_rate
            expr: >-
              (
                anomaly_detector:http_5xx_rps
                / clamp_min(anomaly_detector:traffic_rps, 0.001)
              )
              * on (namespace, deployment)
                (anomaly_detector:traffic_rps >= bool (100 / 120))
              * on (namespace, deployment)
                (anomaly_detector:http_5xx_rps >= bool (5 / 120))

          - record: anomaly_detector:node_cpu_utilization_percent
            expr: >-
              100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[2m])))

          - record: anomaly_detector:node_memory_utilization_percent
            expr: >-
              100 * (
                1 - (
                  max by (node) (node_memory_MemAvailable_bytes)
                  / max by (node) (node_memory_MemTotal_bytes)
                )
              )

          - record: anomaly_detector:node_disk_io_bytes_per_second
            expr: >-
              sum by (node) (
                rate(node_disk_read_bytes_total{device=~".+"}[2m])
                + rate(node_disk_written_bytes_total{device=~".+"}[2m])
              )

          - record: anomaly_detector:node_network_io_bytes_per_second
            expr: >-
              sum by (node) (
                rate(node_network_receive_bytes_total{device!="lo"}[2m])
                + rate(node_network_transmit_bytes_total{device!="lo"}[2m])
              )
