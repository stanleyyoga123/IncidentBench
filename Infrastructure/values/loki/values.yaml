loki:
  auth_enabled: false

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  # Checkpoint frequently so an eviction or abrupt node restart cannot leave a
  # multi-gigabyte WAL replay backlog. Flush cleanly during planned rollouts.
  ingester:
    wal:
      checkpoint_duration: 1m
      flush_on_shutdown: true
  
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
  ruler:
    enable_api: true

defaults:
  nodeSelector:
    role: tools

gateway:
  nodeSelector:
    role: tools
  # Only one node carries role=tools. A rolling update cannot schedule the new
  # gateway alongside the old one because the chart defaults to hard pod
  # anti-affinity, so replace the single replica in place.
  deploymentStrategy:
    type: Recreate

chunksCache:
  nodeSelector:
    role: tools

resultsCache:
  nodeSelector:
    role: tools

minio:
  enabled: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  nodeSelector:
    role: tools
# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
