apiVersion: v1
kind: ServiceAccount
metadata: {name: mcp-tools-investigation, namespace: agents}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mcp-tools-remediation, namespace: agents}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: mcp-tools-investigation}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, pods/log, services, endpoints, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, networking.k8s.io, metrics.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: mcp-tools-investigation}
subjects:
  - {kind: ServiceAccount, name: mcp-tools-investigation, namespace: agents}
  - {kind: ServiceAccount, name: mcp-tools-remediation, namespace: agents}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mcp-tools-investigation}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: mcp-tools-remediation-node-maintainer}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [policy]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: mcp-tools-remediation-node-maintainer}
subjects:
  - {kind: ServiceAccount, name: mcp-tools-remediation, namespace: agents}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mcp-tools-remediation-node-maintainer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mcp-tools-remediation, namespace: online-boutique}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, services, endpoints, configmaps, events]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mcp-tools-remediation, namespace: online-boutique}
subjects:
  - {kind: ServiceAccount, name: mcp-tools-remediation, namespace: agents}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mcp-tools-remediation}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mcp-tools-network-probes, namespace: utility}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mcp-tools-investigation-network-probes, namespace: utility}
subjects:
  - {kind: ServiceAccount, name: mcp-tools-investigation, namespace: agents}
  - {kind: ServiceAccount, name: mcp-tools-remediation, namespace: agents}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mcp-tools-network-probes}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mcp-tools-remediation-artifacts, namespace: agents}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-tools-investigation, namespace: agents}
spec:
  replicas: 0
  selector: {matchLabels: {app: mcp-tools-investigation}}
  template:
    metadata: {labels: {app: mcp-tools-investigation, agent-platform: mcp}}
    spec:
      serviceAccountName: mcp-tools-investigation
      nodeSelector: {role: tools}
      containers:
        - name: mcp-tools-investigation
          image: mcp-tools:latest
          ports: [{name: http, containerPort: 8090}]
          volumeMounts: [{name: config, mountPath: /app/.env, subPath: .env, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes: [{name: config, secret: {secretName: mcp-tools-investigation-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: mcp-tools-investigation, namespace: agents}
spec: {type: ClusterIP, selector: {app: mcp-tools-investigation}, ports: [{name: http, port: 8090, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-tools-remediation, namespace: agents}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mcp-tools-remediation}}
  template:
    metadata: {labels: {app: mcp-tools-remediation, agent-platform: mcp}}
    spec:
      serviceAccountName: mcp-tools-remediation
      nodeSelector: {role: tools}
      containers:
        - name: mcp-tools-remediation
          image: mcp-tools:latest
          ports: [{name: http, containerPort: 8090}]
          volumeMounts:
            - {name: config, mountPath: /app/.env, subPath: .env, readOnly: true}
            - {name: artifacts, mountPath: /sessions}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes:
        - {name: config, secret: {secretName: mcp-tools-remediation-config}}
        - {name: artifacts, persistentVolumeClaim: {claimName: mcp-tools-remediation-artifacts}}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-tools-remediation, namespace: agents}
spec: {type: ClusterIP, selector: {app: mcp-tools-remediation}, ports: [{name: http, port: 8090, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rca-agent, namespace: agents}
spec:
  replicas: 0
  selector: {matchLabels: {app: rca-agent}}
  template:
    metadata: {labels: {app: rca-agent, agent-platform: job-service}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {role: tools}
      containers:
        - name: rca-agent
          image: rca-agent:latest
          ports: [{name: http, containerPort: 8081}]
          volumeMounts: [{name: config, mountPath: /app/.env, subPath: .env, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes: [{name: config, secret: {secretName: rca-agent-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: rca-agent, namespace: agents}
spec: {type: ClusterIP, selector: {app: rca-agent}, ports: [{name: http, port: 8081, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: remediator-agent, namespace: agents}
spec:
  replicas: 0
  selector: {matchLabels: {app: remediator-agent}}
  template:
    metadata: {labels: {app: remediator-agent, agent-platform: job-service}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {role: tools}
      containers:
        - name: remediator-agent
          image: remediator-agent:latest
          ports: [{name: http, containerPort: 8082}]
          volumeMounts: [{name: config, mountPath: /app/.env, subPath: .env, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes: [{name: config, secret: {secretName: remediator-agent-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: remediator-agent, namespace: agents}
spec: {type: ClusterIP, selector: {app: remediator-agent}, ports: [{name: http, port: 8082, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-orchestrator, namespace: agents}
spec:
  replicas: 0
  selector: {matchLabels: {app: agent-orchestrator}}
  template:
    metadata: {labels: {app: agent-orchestrator, agent-platform: coordinator}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {role: tools}
      containers:
        - name: agent-orchestrator
          image: agent-orchestrator:latest
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /app/.env, subPath: .env, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: config, secret: {secretName: agent-orchestrator-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: agent-orchestrator, namespace: agents}
spec: {type: ClusterIP, selector: {app: agent-orchestrator}, ports: [{name: http, port: 8080, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agent-platform-ingress, namespace: agents}
spec:
  podSelector: {matchExpressions: [{key: agent-platform, operator: Exists}]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: agent-orchestrator}}
        - podSelector: {matchLabels: {app: rca-agent}}
        - podSelector: {matchLabels: {app: remediator-agent}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: anomaly-detector}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: mcp-tools-network-probe-overlay, namespace: utility}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: mcp-tools-network-probe, app.kubernetes.io/component: overlay}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-tools-network-probe, app.kubernetes.io/component: overlay}
      annotations: {sidecar.istio.io/inject: "false"}
    spec:
      nodeSelector: {role: services}
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.16
          command: [iperf3, --server]
          ports: [{name: iperf, containerPort: 5201}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [NET_RAW]}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: mcp-tools-network-probe-underlay, namespace: utility}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: mcp-tools-network-probe, app.kubernetes.io/component: underlay}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-tools-network-probe, app.kubernetes.io/component: underlay}
      annotations: {sidecar.istio.io/inject: "false"}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {role: services}
      containers:
        - name: probe
          image: nicolaka/netshoot:v0.16
          command: [iperf3, --server]
          ports: [{name: iperf, containerPort: 5201}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [NET_RAW]}}
