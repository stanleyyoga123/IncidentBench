apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-agent-config
  namespace: agents
data:
  .env: |
    orchestrator.base_url=http://agent-orchestrator.agents.svc.cluster.local:8080
    orchestrator.token=${AGENT_STORE_TOKEN}
    api.host=0.0.0.0
    api.port=8083
    api.submit_token=${LEARNING_SUBMIT_TOKEN}
    client.model=Qwen/Qwen3.6-35B-A3B
    client.url=${CLIENT_URL}
    client.token=${CLIENT_TOKEN}
    worker.poll_interval_seconds=2
    worker.lease_seconds=600
    worker.max_attempts=3
