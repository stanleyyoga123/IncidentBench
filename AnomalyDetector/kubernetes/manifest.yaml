apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
  namespace: agents
  labels:
    app.kubernetes.io/name: anomaly-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-detector
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        role: tools
      containers:
        - name: anomaly-detector
          image: stanleyyoga123/anomaly-detector:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: anomaly-detector-config
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-detector
  namespace: agents
  labels:
    app.kubernetes.io/name: anomaly-detector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anomaly-detector
  ports:
    - name: http
      port: 8080
      targetPort: http
